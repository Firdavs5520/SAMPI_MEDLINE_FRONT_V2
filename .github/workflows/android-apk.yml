name: Android TV APK

# TV ilovasi (Capacitor) APK'si GitHub'da yig'iladi: kompyuterga JDK/Android SDK
# o'rnatish shart emas. Tayyor APK "Artifacts" bo'limida yuklab olinadi.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: |
          version=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/sampi-medicine-tv-${version}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: sampi-medicine-tv-apk
          path: out/*.apk
          retention-days: 30
